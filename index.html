<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menú Castañu">
<title>Menú especial · El Rincón del Castañu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ec;--card:#fff;--text:#222;--muted:#6b6b66;--accent:#2b2b2b;--border:#e1ddd3}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#222221;--text:#f2f1ee;--muted:#a3a29c;--accent:#55534e;--border:#33332f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 14px max(40px,env(safe-area-inset-bottom))}
.wrap{max-width:1000px;margin:auto;display:grid;gap:18px}
@media(min-width:880px){.wrap{grid-template-columns:1fr 1fr;align-items:start}.prev{position:sticky;top:14px}}
h1{font-size:1.25rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;font-size:.9rem;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
canvas{display:block;margin:auto;max-width:100%;max-height:68vh;width:auto;height:auto;border:1px solid var(--border);border-radius:4px;background:#fff}
label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 4px}
input[type=text],textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:1rem}
textarea{min-height:76px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.95rem}
.chk input{width:20px;height:20px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;text-align:center;margin-top:10px}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--border);font-weight:500}
.row{display:flex;gap:8px}.row>*{flex:1}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
input[type=file]{display:none}
input[type=range]{width:100%}
.hint{color:var(--muted);font-size:.8rem;margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="prev card">
    <h1>Menú especial · El Rincón del Castañu</h1>
    <div class="tabs" id="tabs">
      <button data-f="retrato" class="on">Retrato</button>
      <button data-f="story">Story</button>
      <button data-f="a5">A5</button>
    </div>
    <canvas id="cv"></canvas>
    <button class="btn" id="dlRetrato">Descargar Retrato (JPG)</button>
    <button class="btn" id="dlStory">Descargar Story (JPG)</button>
    <button class="btn" id="dlA5">Descargar A5 (PDF)</button>
    <button class="btn sec" id="share">Compartir el formato que estoy viendo</button>
  </div>

  <div class="card">
    <label for="titulo" style="margin-top:0">Título</label>
    <input type="text" id="titulo" value="Menú especial">
    <label for="subtitulo">Subtítulo (opcional)</label>
    <input type="text" id="subtitulo" value="Día del Pilar">
    <label for="fechas">Fechas</label>
    <input type="text" id="fechas" value="12 de octubre">

    <label for="entrantes">Entrantes (un plato por línea)</label>
    <textarea id="entrantes">Croquetas caseras
Ensalada de temporada</textarea>
    <label for="primeros">Primeros</label>
    <textarea id="primeros">Fabada asturiana
Crema de calabaza</textarea>
    <label for="segundos">Segundos</label>
    <textarea id="segundos">Cachopo de ternera
Merluza a la sidra</textarea>
    <label for="postres">Postres</label>
    <textarea id="postres">Arroz con leche
Tarta de queso</textarea>
    <label class="chk"><input type="checkbox" id="elegir" checked> Mostrar «a elegir» en cada apartado</label>

    <label for="bebida">Bebida</label>
    <input type="text" id="bebida" value="Agua, vino o sidra">
    <div class="row">
      <div><label for="precio">Precio</label><input type="text" id="precio" value="25 €"></div>
      <div><label for="nota">Nota bajo el precio</label><input type="text" id="nota" value="IVA incluido"></div>
    </div>

    <label>Imagen de fondo</label>
    <div class="row">
      <label class="btn sec" for="bg" style="margin:0">Elegir imagen</label>
      <button class="btn sec" id="bgQuit" style="margin:0">Quitar</button>
    </div>
    <input type="file" id="bg" accept="image/*">
    <label for="opac">Opacidad del panel blanco</label>
    <input type="range" id="opac" min="40" max="100" value="88">
    <p class="hint">Sin imagen, el fondo es color crema.</p>

    <details style="margin-top:14px">
      <summary>Datos fijos del restaurante</summary>
      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" value="C. Ramón del Valle, 3 (Arriondas)">
      <label for="reservas">Reservas</label>
      <input type="text" id="reservas" value="Reservas: 985 84 16 74 | 646 446 655">
    </details>

    <button class="btn sec" id="limpiar">Empezar un menú nuevo (vaciar platos)</button>
  </div>
</div>

const FONT='"Cormorant Garamond",Georgia,"Times New Roman",serif';
const SAGE='#2b2b2b', SAGE_BG='#ece6d8', DARK='#252522', GRAY='#6b6b66';
const FORMATS={
  retrato:{w:1080,h:1350,inset:{x:60,t:60,b:60}},
  story:{w:1080,h:1920,inset:{x:60,t:230,b:280}},
  a5:{w:1748,h:2480,inset:{x:70,t:70,b:70}}
};
const IDS=['titulo','subtitulo','fechas','entrantes','primeros','segundos','postres','bebida','precio','nota','direccion','reservas'];
const $=id=>document.getElementById(id);
let fmt='retrato', bgImg=null, logoImg=null, timer=null;

/* ---------- carga de imágenes ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function loadFile(file){
  try{return await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){return loadImg(URL.createObjectURL(file));}
}
const iw=i=>i.width||i.naturalWidth, ih=i=>i.height||i.naturalHeight;

/* ---------- estado y guardado ---------- */
function getState(){
  const st={};IDS.forEach(i=>st[i]=$(i).value);
  st.elegir=$('elegir').checked;st.opac=+$('opac').value/100;return st;
}
function save(){try{localStorage.setItem('menu-castanu',JSON.stringify(getState()));}catch(e){}}
function restore(){
  try{
    const s=JSON.parse(localStorage.getItem('menu-castanu')||'null');if(!s)return;
    IDS.forEach(i=>{if(typeof s[i]==='string')$(i).value=s[i];});
    if(typeof s.elegir==='boolean')$('elegir').checked=s.elegir;
    if(s.opac)$('opac').value=Math.round(s.opac*100);
  }catch(e){}
}

/* ---------- texto ---------- */
function wrap(ctx,text,maxW,ls){
  const mw=t=>ctx.measureText(t).width+ls*Math.max(0,t.length-1);
  const lines=[];
  for(const para of text.split('\n')){
    let cur='';
    for(const w of para.split(/\s+/).filter(Boolean)){
      const t=cur?cur+' '+w:w;
      if(mw(t)<=maxW||!cur)cur=t;else{lines.push(cur);cur=w;}
    }
    if(cur)lines.push(cur);
  }
  return lines;
}
function drawLine(ctx,t,cx,y,ls){
  if(!ls){ctx.textAlign='center';ctx.fillText(t,cx,y);return;}
  let w=0;for(const ch of t)w+=ctx.measureText(ch).width+ls;w-=ls;
  let x=cx-w/2;ctx.textAlign='left';
  for(const ch of t){ctx.fillText(ch,x,y);x+=ctx.measureText(ch).width+ls;}
  ctx.textAlign='center';
}
function priceText(p){p=(p||'').trim();return /^[\d.,\s]+$/.test(p)&&p?p+' €':p;}
const lines_of=v=>(v||'').split('\n').map(x=>x.trim()).filter(Boolean);

/* ---------- maquetación (medir y dibujar con la misma función) ---------- */
function pass(ctx,o){
  const {s,k,cw,cx,y0,draw,st}=o;
  let y=0;
  const text=(txt,weight,size,color,ls,gap,upper)=>{
    if(!txt)return;
    if(upper)txt=txt.toUpperCase();
    let px=size*k*s, l=ls*k*s;
    ctx.font=`${weight} ${px}px ${FONT}`;
    ctx.fillStyle=color;ctx.textBaseline='top';
    const lines=wrap(ctx,txt,cw,l);
    const lh=px*1.3;
    for(const ln of lines){if(draw)drawLine(ctx,ln,cx,y0+y,l);y+=lh;}
    y+=gap*k*s;
  };
  if(logoImg){
    const L=280*k*Math.min(1.1,0.6+0.4*s);
    if(draw){ctx.globalCompositeOperation='multiply';ctx.drawImage(logoImg,cx-L/2,y0+y,L,L);ctx.globalCompositeOperation='source-over';}
    y+=L+10*k*s;
  }
  text(st.titulo,600,76,DARK,6,8,true);
  text(st.subtitulo,600,36,SAGE,5,6,true);
  text(st.fechas,400,34,GRAY,2,0,false);
  y+=22*k*s;
  if(draw){ctx.fillStyle=SAGE;ctx.fillRect(cx-40*k,y0+y,80*k,2*k);}
  y+=26*k*s;
  const secs=[['Entrantes',st.entrantes],['Primeros',st.primeros],['Segundos',st.segundos],['Postres',st.postres]];
  for(const [h,v] of secs){
    const ls=lines_of(v);if(!ls.length)continue;
    text(h,700,30,SAGE,6,st.elegir?0:8,true);
    if(st.elegir)text('(a elegir)',400,26,GRAY,1,8,false);
    for(const d of ls)text(d,500,41,DARK,0,6,false);
    y+=22*k*s;
  }
  if(st.bebida&&st.bebida.trim()){
    text('Bebida',700,30,SAGE,6,8,true);
    text(st.bebida.trim(),500,39,DARK,0,0,false);
    y+=22*k*s;
  }
  const pr=priceText(st.precio);
  if(pr){
    y+=6*k*s;
    text(pr,700,78,DARK,2,2,false);
    text(st.nota,400,28,GRAY,1,0,false);
  }
  return y;
}

async function render(cv,f){
  const F=FORMATS[f],W=F.w,H=F.h,k=W/1080,st=getState();
  cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  // fondo
  if(bgImg){
    const sc=Math.max(W/iw(bgImg),H/ih(bgImg)),dw=iw(bgImg)*sc,dh=ih(bgImg)*sc;
    ctx.drawImage(bgImg,(W-dw)/2,(H-dh)/2,dw,dh);
  }else{ctx.fillStyle=SAGE_BG;ctx.fillRect(0,0,W,H);}
  // panel
  const px=F.inset.x*k,pt=F.inset.t*k,pb=F.inset.b*k;
  const pw=W-2*px,ph=H-pt-pb,pad=48*k;
  ctx.globalAlpha=bgImg?st.opac:Math.max(st.opac,0.96);
  ctx.fillStyle='#ffffff';ctx.fillRect(px,pt,pw,ph);ctx.globalAlpha=1;
  const cw=pw-2*pad,cx=W/2;
  // pie
  ctx.font=`500 ${28*k}px ${FONT}`;ctx.fillStyle=DARK;ctx.textBaseline='top';
  const fl=[...wrap(ctx,st.direccion||'',cw,0),...wrap(ctx,st.reservas||'',cw,0)];
  const flh=28*k*1.4,fh=fl.length*flh;
  const avail=ph-2*pad-fh-34*k;
  // ajustar tamaño
  let s=1.3,h;
  for(;;){
    h=pass(ctx,{s,k,cw,cx,y0:0,draw:false,st});
    if(h<=avail||s<=0.35)break;
    s-=0.03;
  }
  const y0=pt+pad+Math.max(0,(avail-h)/2);
  pass(ctx,{s,k,cw,cx,y0,draw:true,st});
  // pie dibujado
  const fy=pt+ph-pad-fh;
  ctx.fillStyle=SAGE;ctx.fillRect(cx-40*k,fy-18*k,80*k,2*k);
  ctx.font=`500 ${28*k}px ${FONT}`;ctx.fillStyle=DARK;ctx.textBaseline='top';ctx.textAlign='center';
  fl.forEach((ln,i)=>ctx.fillText(ln,cx,fy+i*flh));
}

async function fontsReady(){
  try{await Promise.all([document.fonts.load('700 40px "Cormorant Garamond"'),document.fonts.load('400 40px "Cormorant Garamond"'),document.fonts.load('600 40px "Cormorant Garamond"')]);}catch(e){}
}
function schedule(){
  clearTimeout(timer);
  timer=setTimeout(async()=>{await fontsReady();await render($('cv'),fmt);},120);
}

/* ---------- exportar ---------- */
function makePdf(jpg,pxW,pxH){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length;};
  const obj=(n,body)=>{off[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n');};
  const PW=419.53,PH=595.28;
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  off[4]=len;
  push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);
  push(jpg);push('\nendstream\nendobj\n');
  const c=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  obj(5,`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
  const xref=len;
  push('xref\n0 6\n0000000000 65535 f \n');
  for(let i=1;i<=5;i++)push(String(off[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
const slug=t=>(t||'menu').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'menu';

async function makeFile(f){
  await fontsReady();
  const cv=document.createElement('canvas');
  await render(cv,f);
  const jpg=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.93));
  const base='castanu-'+slug($('titulo').value);
  if(f==='a5'){
    const bytes=new Uint8Array(await jpg.arrayBuffer());
    return new File([makePdf(bytes,cv.width,cv.height)],base+'_A5.pdf',{type:'application/pdf'});
  }
  return new File([jpg],base+'_'+f+'.jpg',{type:'image/jpeg'});
}
function saveFile(file){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file);a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
async function download(f){try{saveFile(await makeFile(f));}catch(e){alert('No se pudo generar el archivo.');}}

/* ---------- eventos ---------- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  fmt=b.dataset.f;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  schedule();
});
[...IDS,'elegir','opac'].forEach(i=>$(i).addEventListener('input',()=>{save();schedule();}));
$('bg').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{bgImg=await loadFile(f);}catch(err){alert('No se pudo abrir la imagen.');}
  e.target.value='';schedule();
});
$('bgQuit').onclick=()=>{bgImg=null;schedule();};
$('dlRetrato').onclick=()=>download('retrato');
$('dlStory').onclick=()=>download('story');
$('dlA5').onclick=()=>download('a5');
$('share').onclick=async()=>{
  try{
    const file=await makeFile(fmt);
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});
    else saveFile(file);
  }catch(e){if(e&&e.name!=='AbortError')alert('No se pudo compartir.');}
};
$('limpiar').onclick=()=>{
  ['subtitulo','fechas','entrantes','primeros','segundos','postres','bebida','precio','nota'].forEach(i=>$(i).value='');
  $('titulo').value='Menú especial';
  save();schedule();
};

(async()=>{
  restore();
  try{logoImg=await loadImg(LOGO_SRC);}catch(e){}
  await fontsReady();
  await render($('cv'),fmt);
})();
</script>
